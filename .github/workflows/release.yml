# Release
#
# Simplest flow: bump the version in package.json, commit, then push a tag:
#
#   git add package.json package-lock.json && git commit -m "chore: bump version to 1.7.0"
#   git tag v1.7.0 && git push --tags
#
# The workflow builds the installers and publishes them (plus latest.yml /
# latest-mac.yml) to a GitHub Release for that tag. Installed apps then
# auto-update via electron-updater, which reads latest.yml from the Release.
#
# You can also trigger it manually from the Actions tab ("Run workflow"),
# which publishes to a release tagged v<version> from package.json.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match package.json version '$version'. Bump package.json first."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package & publish to GitHub Release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are unsigned (no Developer ID cert) so they're still
          # published as a manual-install dmg. Windows auto-update works fully.
          # To enable macOS auto-update, add signing env vars (CSC_LINK/CSC_KEY_PASSWORD).
          CSC_IDENTITY_AUTO_DISCOVERY: false